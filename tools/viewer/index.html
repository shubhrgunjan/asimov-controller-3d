<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAIR Lab Authoritative Environment Viewer (Three.js)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 16px;
      width: 320px;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #38bdf8;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .hud-label {
      color: #cbd5e1;
    }
    .hud-value {
      font-weight: 700;
      color: #38bdf8;
      font-family: monospace;
    }
    select, input[type="range"], button {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }
    select:focus, button:focus {
      border-color: #38bdf8;
    }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
    }
    .btn {
      background: #0284c7;
      color: #fff;
      font-weight: 700;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #0369a1;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #090d16;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #inspector {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 11px;
      color: #cbd5e1;
      max-width: 450px;
      z-index: 100;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text" style="font-weight: 700; color: #38bdf8; letter-spacing: 1px;">LOADING AUTHORITATIVE PAIR_LAB.GLB...</div>
    <div id="loading-sub" style="font-size: 12px; color: #64748b; margin-top: 6px;">0%</div>
  </div>

  <div id="canvas-container"></div>

  <div id="hud">
    <h1>PAIR Lab Viewer</h1>
    <div class="subtitle">Direct glTF 2.0 Export from PAIR_Lab.blend</div>

    <div class="hud-row">
      <span class="hud-label">Camera Angle:</span>
      <select id="camera-select">
        <option value="overview">Overview (Isometric)</option>
        <option value="adjustable_desk">Adjustable Desk</option>
        <option value="workspace_south">Workspace South</option>
        <option value="presentation">Presentation Area</option>
        <option value="cubes">Obstacle Cubes</option>
        <option value="topdown">Top-down Floorplan</option>
      </select>
    </div>

    <div class="hud-row">
      <span class="hud-label">Tone Mapping:</span>
      <select id="tonemap-select">
        <option value="aces" selected>ACES Filmic</option>
        <option value="agx">AgX (Blender 4+)</option>
        <option value="linear">Linear</option>
        <option value="reinhard">Reinhard</option>
      </select>
    </div>

    <div class="hud-row">
      <span class="hud-label">Exposure:</span>
      <input type="range" id="exposure-slider" min="0.2" max="3.0" step="0.05" value="1.0">
      <span id="exposure-val" class="hud-value">1.0</span>
    </div>

    <div class="hud-row">
      <span class="hud-label">Objects Loaded:</span>
      <span id="stat-objects" class="hud-value">-</span>
    </div>

    <div class="hud-row">
      <span class="hud-label">Total Triangles:</span>
      <span id="stat-triangles" class="hud-value">-</span>
    </div>

    <div class="hud-row">
      <span class="hud-label">Materials:</span>
      <span id="stat-materials" class="hud-value">-</span>
    </div>

    <div class="btn-row">
      <button class="btn" id="btn-wireframe">Toggle Wireframe</button>
      <button class="btn" id="btn-reset-cam">Reset View</button>
    </div>
  </div>

  <div id="inspector">
    Click on any 3D asset in the room to inspect its authentic name, mesh specs, and material attributes.
  </div>

  <script type="module" src="./viewer.js"></script>
</body>
</html>
